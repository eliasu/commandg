title: Media
fields:
  -
    handle: files
    field:
      type: assets
      display: Files
      instructions: 'Ein Bild oder ein Video (MP4, möglichst unter 10 MB, läuft stumm in Schleife). Mehrere Dateien – Bilder und Videos gemischt – werden in dieser Reihenfolge als Slideshow gezeigt. Bilder werden auf das Format dieses Platzes zugeschnitten; der Fokuspunkt bestimmt den Ausschnitt.'
      container: assets
      mode: grid
      validate:
        - 'mimes:jpg,jpeg,png,webp,avif,gif,svg,mp4,webm'
  -
    handle: transition
    field:
      type: button_group
      display: Transition
      instructions: 'Wie eine Datei zur nächsten wechselt.'
      options:
        fade: Fade
        slide: 'Slide left'
        slide-right: 'Slide right'
        slide-up: 'Slide up'
        slide-down: 'Slide down'
        none: None
      default: fade
      if:
        files: 'custom multiple'
  -
    handle: interval
    field:
      type: integer
      display: 'Milliseconds per slide'
      instructions: 'Wie lange jedes Bild stehen bleibt, in Millisekunden (1000 = 1 Sekunde). Unter 1000 wird es ein schnelles Flackern.'
      default: 4000
      if:
        files: 'custom multiple'
  -
    handle: video_end
    field:
      type: button_group
      display: 'Videos in slideshow'
      instructions: 'Ob ein Video bis zu seinem Ende läuft oder wie ein Bild nach der eingestellten Zeit wechselt.'
      options:
        end: 'Play to end'
        interval: 'After interval'
      default: end
      if:
        files: 'custom multiple'
