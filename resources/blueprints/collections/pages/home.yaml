title: Home
order: 2
tabs:
  main:
    display: Content
    sections:
      -
        display: Hero
        instructions: 'Der erste Bereich der Startseite.'
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              instructions: 'Name der Seite im Control Panel und im Browser-Tab.'
              required: true
              validate:
                - required
          -
            handle: hero_heading_muted
            field:
              type: text
              display: 'Heading (grey part)'
              instructions: 'Erster, grau dargestellter Teil der Hauptüberschrift (z. B. „Du sagst, was du willst.“).'
              character_limit: 40
          -
            handle: hero_heading
            field:
              type: text
              display: Heading
              instructions: 'Zweiter, schwarzer Teil der Hauptüberschrift.'
              character_limit: 40
              validate:
                - required
          -
            handle: hero_text
            field:
              type: textarea
              display: Text
              instructions: 'Ein bis zwei Sätze unter der Überschrift.'
              character_limit: 220
          -
            handle: hero_media
            field:
              type: grid
              display: Media
              instructions: 'Drei Medien unter dem Text: zuerst breit (16:10, auf kleinen Bildschirmen quadratisch), dann hoch (3:4), dann ein Panorama über die volle Breite (21:9). Leere Plätze zeigen einen Platzhalter.'
              max_rows: 3
              mode: stacked
              add_row: 'Add media'
              fields:
                -
                  import: media
      -
        display: Info
        fields:
          -
            handle: info_text
            field:
              type: textarea
              display: Text
              instructions: 'Kurze Vorstellung in großer Schrift, drei bis vier Sätze.'
              character_limit: 360
              validate:
                - required
          -
            handle: info_link_label
            field:
              type: text
              display: 'Link label'
              instructions: 'Beschriftung des Links darunter. Er führt zum Kontaktbereich.'
              character_limit: 30
      -
        display: Promise
        fields:
          -
            handle: promise_text
            field:
              type: textarea
              display: Text
              instructions: 'Großer Text zwischen Leistungen und Arbeiten: wie ihr mit Kund:innen arbeitet. Zwei bis drei Sätze.'
              character_limit: 300
      -
        display: Work
        instructions: 'Die Projekte selbst werden unter „Projects“ gepflegt, die Leistungen unter „Services“.'
        fields:
          -
            handle: work_text
            field:
              type: textarea
              display: Text
              instructions: 'Ein Satz über den Projekten.'
              character_limit: 160
          -
            handle: experiments
            field:
              type: grid
              display: 'Side projects'
              instructions: 'Medien für das Band „Nebenbei – Experimente und Leidenschaften“ (Querformat 4:3). Bleibt es leer, erscheinen Platzhalter.'
              mode: stacked
              add_row: 'Add media'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    instructions: 'Kleiner Titel links unter dem Medium.'
                    character_limit: 40
                -
                  import: media
      -
        display: Contact
        instructions: 'E-Mail-Adresse und LinkedIn werden unter Globals → Company gepflegt.'
        fields:
          -
            handle: contact_heading
            field:
              type: text
              display: Heading
              instructions: 'Große Überschrift im Kontaktbereich.'
              character_limit: 70
              validate:
                - required
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
              default: pages/home
              visibility: hidden
