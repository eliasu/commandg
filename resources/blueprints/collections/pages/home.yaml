title: Home
order: 2
tabs:
  main:
    display: Content
    sections:
      -
        display: Hero
        instructions: 'Der erste Bereich der Startseite.'
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              instructions: 'Name der Seite im Control Panel und im Browser-Tab.'
              required: true
              validate:
                - required
          -
            handle: hero_heading_muted
            field:
              type: text
              display: 'Heading (grey part)'
              instructions: 'Erster, grau dargestellter Teil der Hauptüberschrift (z. B. „Du sagst, was du willst.“).'
              character_limit: 40
          -
            handle: hero_heading
            field:
              type: text
              display: Heading
              instructions: 'Zweiter, schwarzer Teil der Hauptüberschrift.'
              character_limit: 40
              validate:
                - required
          -
            handle: hero_dialog
            field:
              type: grid
              display: Dialog
              instructions: 'Das Gespräch der beiden Köpfe neben der Überschrift. Links sagt jemand etwas, rechts kommt die Antwort; dann folgt die nächste Zeile. Kurz halten, damit man es im Vorbeigehen lesen kann.'
              mode: table
              max_rows: 12
              add_row: 'Zeile hinzufügen'
              fields:
                -
                  handle: say
                  field:
                    type: text
                    display: Says
                    instructions: 'Was der linke Kopf sagt, z. B. „Wir brauchen mehr Anfragen.“'
                    character_limit: 50
                    validate:
                      - required
                -
                  handle: reply
                  field:
                    type: text
                    display: Reply
                    instructions: 'Die Antwort des rechten Kopfs.'
                    character_limit: 55
                    validate:
                      - required
          -
            handle: hero_projects
            field:
              type: entries
              display: Projects
              instructions: 'Drei Projekte, deren Medien unter dem Text erscheinen: zuerst breit (16:10, auf kleinen Bildschirmen quadratisch), dann hoch (3:4), dann ein Panorama über die volle Breite (21:9). Leere Plätze zeigen einen Platzhalter.'
              collections:
                - projects
              max_items: 3
              mode: default
      -
        display: Info
        fields:
          -
            handle: info_text
            field:
              type: textarea
              display: Text
              instructions: 'Kurze Vorstellung in großer Schrift, drei bis vier Sätze.'
              character_limit: 360
              validate:
                - required
          -
            handle: info_link_label
            field:
              type: text
              display: 'Link label'
              instructions: 'Beschriftung des Links darunter. Er führt zum Kontaktbereich.'
              character_limit: 30
      -
        display: 'How we work'
        fields:
          -
            handle: steps
            field:
              type: grid
              display: Steps
              instructions: 'Die Punkte unter „Wie wir arbeiten“, in dieser Reihenfolge. Jeder Punkt hat einen kurzen Titel und ein bis drei Sätze.'
              mode: stacked
              max_rows: 6
              add_row: 'Punkt hinzufügen'
              fields:
                -
                  handle: icon
                  field:
                    type: select
                    display: Icon
                    instructions: 'Linien-Icon über dem Titel.'
                    options:
                      step-understand: Understand
                      step-recommend: Recommend
                      step-build: Build
                      step-stay: Stay
                -
                  handle: title
                  field:
                    type: text
                    display: Title
                    instructions: 'Kurzer Titel, z. B. „Erst verstehen.“'
                    character_limit: 50
                    validate:
                      - required
                -
                  handle: text
                  field:
                    type: textarea
                    display: Text
                    instructions: 'Ein bis drei Sätze.'
                    character_limit: 280
                    validate:
                      - required
      -
        display: Work
        instructions: 'Die Projekte selbst werden unter „Projects“ gepflegt und hier nur ausgewählt. Die Leistungen stehen unter „Services“.'
        fields:
          -
            handle: work_text
            field:
              type: textarea
              display: Text
              instructions: 'Ein Satz über den Projekten.'
              character_limit: 160
          -
            handle: work_projects
            field:
              type: entries
              display: Projects
              instructions: 'Projekte im Bereich „Arbeiten“, in dieser Reihenfolge. Das Format ergibt sich aus dem Platz im Raster.'
              collections:
                - projects
              mode: default
      -
        display: 'Side projects'
        fields:
          -
            handle: side_projects
            field:
              type: entries
              display: Projects
              instructions: 'Projekte für das Band „Nebenbei – Experimente und Leidenschaften“ (Querformat 4:3), in dieser Reihenfolge. Bleibt es leer, erscheinen Platzhalter.'
              collections:
                - projects
              mode: default
      -
        display: Contact
        instructions: 'E-Mail-Adresse und LinkedIn werden unter Globals → Company gepflegt.'
        fields:
          -
            handle: contact_heading
            field:
              type: text
              display: Heading
              instructions: 'Große Überschrift im Kontaktbereich.'
              character_limit: 70
              validate:
                - required
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            import: seo
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
              default: pages/home
              visibility: hidden
