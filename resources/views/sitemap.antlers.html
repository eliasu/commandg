<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection:pages as="pages" }}{{ pages scope="page" }}{{ unless page:noindex }}
    <url>
        <loc>{{ page:permalink }}</loc>
        <lastmod>{{ page:last_modified format="Y-m-d" }}</lastmod>
    </url>
{{ /unless }}{{ /pages }}{{ /collection:pages }}
</urlset>
